[package]
name = "js-gui"
version.workspace = true
edition.workspace = true
build = "build.rs"

[[bin]]
name = "JournalScanner"
path = "src/main.rs"
# Yönetici manifesti test exe'sine de gömülür; yönetici olmayan kullanıcıda cargo test çalışabilsin diye kapalı
test = false

[dependencies]
js-core.workspace = true
mimalloc.workspace = true
js-native.workspace = true
eframe.workspace = true
egui.workspace = true
egui_extras.workspace = true
rfd.workspace = true
windows = { workspace = true, features = [
    "Win32_UI_Shell",
    "Win32_Foundation",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Kernel",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
embed-manifest.workspace = true
winresource.workspace = true
