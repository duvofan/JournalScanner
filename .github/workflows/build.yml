name: Derleme ve Release

# main'e her gönderimde: biçim / test / clippy denetlenir, Windows exe'si derlenir (Rust, MSVC, statik CRT)
# ve artifact olarak saklanır. Cargo.toml'daki sürümün Release'i henüz yoksa yalnızca exe ile açılır (notlarda
# SHA-256 ve VirusTotal bağlantısı); var olan Release'e dokunulmaz (sürüm artırılınca yenisi açılır).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-exe:
    name: JournalScanner.exe (Rust)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add clippy rustfmt
          rustc --version

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Biçim
        run: cargo fmt --all --check

      - name: Testler
        run: cargo test --workspace --locked

      - name: Clippy
        run: cargo clippy --workspace --locked -- -D warnings

      - name: Derle (release)
        run: cargo build --release --workspace --locked

      - name: Sürüm
        id: v
        shell: bash
        run: |
          V=$(grep -m1 -oP '^version = "\K[0-9]+\.[0-9]+\.[0-9]+' Cargo.toml)
          test -n "$V"
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Paketle
        id: p
        shell: bash
        run: |
          mkdir -p dist && cp target/release/JournalScanner.exe dist/
          H=$(sha256sum dist/JournalScanner.exe | cut -d' ' -f1)
          echo "sha=$H" >> "$GITHUB_OUTPUT"
          echo "SHA-256: $H"

      - uses: actions/upload-artifact@v4
        with:
          name: JournalScanner-${{ steps.v.outputs.version }}
          path: dist/JournalScanner.exe
          if-no-files-found: error

      - name: Release notları
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          H=${{ steps.p.outputs.sha }}
          {
            echo "**SHA-256:** \`$H\`"
            echo
            echo "[VirusTotal](https://www.virustotal.com/gui/file/$H)"
          } > notes.md
          cat notes.md

      - name: Release aç (yoksa)
        # Bu adım yalnızca o sürümün Release'i HENÜZ yoksa açar (yedek); var olan Release'in dosyalarına dokunmaz.
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=v${{ steps.v.outputs.version }}
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG Release'i zaten var (gelistiricinin yukledigi exe korunuyor); bu derleme yalnizca artifact olarak saklandi."
          else
            gh release create "$TAG" dist/JournalScanner.exe \
              --title "JournalScanner $TAG" --notes-file notes.md --target "$GITHUB_SHA" --latest
          fi
